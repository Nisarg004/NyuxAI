name: dispatch

# Fires the Brieff scheduler. Every 15 minutes it POSTs to /api/cron/dispatch on
# the deployed app, which queues a generate job for every user whose delivery time
# is within the next 45 minutes and starts parallel workers (in the background, on
# the server) to build those briefs ahead of time. The same tick also starts workers
# for send jobs that have come due. GitHub's cron is best-effort and often runs several
# minutes late — that's fine, generation has a 45 minute head start and everything is
# idempotent per (user, scheduled slot). For demos where even 5-15 minutes of
# lateness is too much, run `npm run watch` locally instead (60s polling).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Never let two dispatch runs overlap.
concurrency:
  group: dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/dispatch
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 60 \
            -X POST "${DISPATCH_URL%/}/api/cron/dispatch" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json"
        env:
          DISPATCH_URL: ${{ secrets.DISPATCH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
